App\Entity\Location:
    properties:
        city:
            - NotBlank:
                  groups: [create, edit]
        country:
            -   NotBlank:
                    groups: [ create, edit ]
        latitude:
            - Range:
                  min: -180
                  max: 180
                  groups: [create, edit]
        longitude:
            -   Range:
                    min: -90
                    max: 90
                    groups: [ create, edit ]
App\Entity\Measurement:
    properties:
        date:
            - NotBlank:
                  groups: [create, edit]
        celsius:
            -   Range:
                    min: -90
                    max: 90
                    groups: [ create, edit ]
        windSpeed:
            -   NotBlank:
                    groups: [ create, edit ]
        visibility:
            -   NotBlank:
                    groups: [ create, edit ]
        pressure:
            -   NotBlank:
                    groups: [ create, edit ]
        location:
            -   NotBlank:
                    groups: [ create, edit ]
